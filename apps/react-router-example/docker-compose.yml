name: hatchet-lite-react-router

services:
  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    ports:
      - "127.0.0.1:${HATCHET_GRPC_PORT:-7077}:7077"
      - "127.0.0.1:${HATCHET_UI_PORT:-8888}:8888"
    environment:
      DATABASE_URL: "postgresql://${HATCHET_DB_USER:?Set HATCHET_DB_USER}:${HATCHET_DB_PASSWORD:?Set HATCHET_DB_PASSWORD}@db:5432/${HATCHET_DB_NAME:?Set HATCHET_DB_NAME}?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "true"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "true"
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:${HATCHET_GRPC_PORT:-7077}
      SERVER_GRPC_INSECURE: "true"
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:${HATCHET_UI_PORT:-8888}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15.6
    ports:
      - "127.0.0.1:${HATCHET_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${HATCHET_DB_NAME:?Set HATCHET_DB_NAME}"
      POSTGRES_PASSWORD: "${HATCHET_DB_PASSWORD:?Set HATCHET_DB_PASSWORD}"
      POSTGRES_USER: "${HATCHET_DB_USER:?Set HATCHET_DB_USER}"
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
