name: 🚀 Release Stable
on:
  workflow_dispatch:
    inputs:
      projects:
        description: "Exact comma-separated seven-project stable matrix"
        required: true
        type: string
      publish_only:
        description: "FINALIZE the exact merged SHA"
        required: true
        type: boolean
        default: false
      expected_sha:
        description: "Full lowercase merged master SHA; FINALIZE only"
        required: false
        type: string
concurrency:
  group: release-stable
  cancel-in-progress: false
env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/effectify"
jobs:
  release-stable:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: postgres,
            POSTGRES_PASSWORD: postgres,
            POSTGRES_DB: effectify,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: 📥 Checkout current master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
        with: { version: 10.14.0 }
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: pnpm install --frozen-lockfile
      - name: 🛡️ Verify release policy contract
        run: node --test scripts/release-policy-contract.test.mjs
      - name: 🧭 Resolve exact stable mode and matrix
        id: release
        env:
          REQUESTED_PROJECTS: ${{ inputs.projects }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          RAW=$(printf '%s' "$REQUESTED_PROJECTS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          test -n "$RAW" || { echo '::error::stable matrix is empty'; exit 1; }
          test -z "$(printf '%s\n' "$RAW" | sort | uniq -d)" || { echo '::error::duplicate stable project'; exit 1; }
          SELECTED=$(printf '%s\n' "$RAW" | sort)
          EXPECTED=$(printf '%s\n' '@effectify/hatchet' '@effectify/node-better-auth' '@effectify/prisma' '@effectify/react-query' '@effectify/react-router' '@effectify/react-router-better-auth' '@effectify/solid-query' | sort)
          cmp -s <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$SELECTED") || { echo '::error::stable requires exact seven-project matrix'; exit 1; }
          if [ "$PUBLISH_ONLY" = true ]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::FINALIZE requires full lowercase expected_sha'; exit 1; }
            MODE=finalize
          else
            test -z "$EXPECTED_SHA" || { echo '::error::PREPARE rejects expected_sha'; exit 1; }
            MODE=prepare
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "projects=$(printf '%s' "$SELECTED" | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - name: 🔒 Fresh master authorization
        env:
          MODE: ${{ steps.release.outputs.mode }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch origin master:refs/remotes/origin/master --no-tags
          HEAD_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/master)
          test "$HEAD_SHA" = "$REMOTE_SHA" || { echo '::error::checkout is not current origin/master'; exit 1; }
          if [ "$MODE" = finalize ]; then test "$HEAD_SHA" = "$EXPECTED_SHA" || { echo '::error::FINALIZE SHA mismatch'; exit 1; }; fi
      - name: 🏗️ Build selected projects
        env: { PROJECTS: "${{ steps.release.outputs.projects }}" }
        run: pnpm nx run-many -t build "--projects=$PROJECTS" --parallel=3
      - name: 🧪 Test selected projects
        env: { PROJECTS: "${{ steps.release.outputs.projects }}" }
        run: pnpm nx run-many -t test "--projects=$PROJECTS" --parallel=3 --passWithNoTests
      - name: ✅ Verify React Router readiness
        run: |
          pnpm nx test @effectify/react-router
          pnpm nx run @effectify/react-router-example:migration:test
          pnpm nx run @effectify/react-router-example:migration:verify
          pnpm nx run @effectify/react-router-example:migration:manifest
          pnpm nx run @effectify/react-router-example:consolidation:verify
      - name: 🌿 PREPARE protected stable branch
        id: prepare
        if: ${{ steps.release.outputs.mode == 'prepare' }}
        env: { PROJECTS: "${{ steps.release.outputs.projects }}" }
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD); SHA_PREFIX=${SOURCE_SHA:0:12}; BRANCH="release/stable-$SHA_PREFIX"
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          EXPECTED_PATHS=$(mktemp); printf '%s\n' CHANGELOG.md packages/hatchet/package.json packages/node/better-auth/package.json packages/prisma/package.json packages/react/query/package.json packages/react/router/package.json packages/react/router-better-auth/package.json packages/solid/query/package.json | sort > "$EXPECTED_PATHS"
          RECORDS=$(mktemp); printf '%s\n' '@effectify/hatchet|packages/hatchet/package.json|0.1.0-beta.0|0.1.0' '@effectify/node-better-auth|packages/node/better-auth/package.json|0.5.12-beta.0|0.5.12' '@effectify/prisma|packages/prisma/package.json|1.1.13-beta.0|1.1.13' '@effectify/react-query|packages/react/query/package.json|1.0.0-beta.1|1.0.0' '@effectify/react-router|packages/react/router/package.json|0.6.0-beta.0|0.6.0' '@effectify/react-router-better-auth|packages/react/router-better-auth/package.json|0.5.12-beta.0|0.5.12' '@effectify/solid-query|packages/solid/query/package.json|0.5.13-beta.0|0.5.13' > "$RECORDS"
          while IFS='|' read -r NAME MANIFEST_PATH OLD NEW; do if DETAIL=$(node -e 'const fs=require("node:fs");const [path,name,version]=process.argv.slice(1);let value;try{value=JSON.parse(fs.readFileSync(path,"utf8"))}catch{process.exit(2)}if(!value||typeof value!=="object"||Array.isArray(value)||typeof value.name!=="string"||typeof value.version!=="string"||value.name!==name||value.version!==version){const actual={name:typeof value?.name==="string"?value.name:null,version:typeof value?.version==="string"?value.version:null};process.stdout.write(`actual=${JSON.stringify(actual)} expected=${JSON.stringify({name,version})}`);process.exit(1)}' "$MANIFEST_PATH" "$NAME" "$OLD"); then :; else STATUS=$?; if [ "$STATUS" = 1 ]; then echo "::error::source manifest identity mismatch for $NAME: $DETAIL"; else echo "::error::source manifest execution or parse failed for $NAME"; fi; exit 1; fi; done < "$RECORDS"
          test -z "$(git status --porcelain)" || { echo '::error::PREPARE requires clean tree'; exit 1; }
          REFS_BEFORE=$(git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | sort)
          while IFS='|' read -r NAME MANIFEST_PATH OLD NEW; do
            pnpm nx release version "$NEW" "--projects=$NAME" --git-commit=false --git-tag=false --git-push=false --stage-changes=false
          done < "$RECORDS"
          test "$REFS_BEFORE" = "$(git for-each-ref --format='%(refname) %(objectname)' refs/heads refs/tags | sort)" || { echo '::error::Nx moved refs'; exit 1; }
          test -z "$(git diff --cached --name-only)" || { echo '::error::Nx staged files'; exit 1; }
          ACTUAL=$(mktemp); { git diff --name-only --no-renames HEAD; git ls-files --others --exclude-standard; } | sort -u > "$ACTUAL"
          cmp -s "$EXPECTED_PATHS" "$ACTUAL" || { echo '::error::unexpected PREPARE paths'; diff -u "$EXPECTED_PATHS" "$ACTUAL" || true; exit 1; }
          while IFS='|' read -r NAME MANIFEST_PATH OLD NEW; do if DETAIL=$(node -e 'const fs=require("node:fs");const [path,name,version]=process.argv.slice(1);let value;try{value=JSON.parse(fs.readFileSync(path,"utf8"))}catch{process.exit(2)}if(!value||typeof value!=="object"||Array.isArray(value)||typeof value.name!=="string"||typeof value.version!=="string"||value.name!==name||value.version!==version){const actual={name:typeof value?.name==="string"?value.name:null,version:typeof value?.version==="string"?value.version:null};process.stdout.write(`actual=${JSON.stringify(actual)} expected=${JSON.stringify({name,version})}`);process.exit(1)}' "$MANIFEST_PATH" "$NAME" "$NEW"); then :; else STATUS=$?; if [ "$STATUS" = 1 ]; then echo "::error::target manifest identity mismatch for $NAME: $DETAIL"; else echo "::error::target manifest execution or parse failed for $NAME"; fi; exit 1; fi; done < "$RECORDS"
          git add --pathspec-from-file="$EXPECTED_PATHS"
          git diff --cached --name-only --no-renames | sort > /tmp/stable-staged
          cmp -s "$EXPECTED_PATHS" /tmp/stable-staged || { echo '::error::staged path contamination'; exit 1; }
          git diff --quiet; test -z "$(git ls-files --others --exclude-standard)"
          git commit -m "chore(release): prepare stable from $SOURCE_SHA [skip release]" || { echo '::error::PREPARE commit failed'; exit 1; }
          test -z "$(git status --porcelain)" || { echo '::error::post-commit tree dirty'; exit 1; }
          git push origin "HEAD:refs/heads/release/stable-$SHA_PREFIX" || { echo '::error::stable branch push failed'; exit 1; }
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"; echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"; echo "changed_paths=$(paste -sd, "$EXPECTED_PATHS")" >> "$GITHUB_OUTPUT"
      - name: 🔐 Verify npm authentication for FINALIZE
        if: ${{ steps.release.outputs.mode == 'finalize' }}
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: npm whoami
      - name: 🚀 FINALIZE exact stable artifacts
        if: ${{ steps.release.outputs.mode == 'finalize' }}
        env:
          PROJECTS: ${{ steps.release.outputs.projects }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: bash scripts/release-finalize-stable.sh
      - name: 📊 Stable summary
        if: always()
        env:
          MODE: ${{ steps.release.outputs.mode || 'failed' }}
          PROJECTS: ${{ steps.release.outputs.projects || '' }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha || '' }}
          BRANCH: ${{ steps.prepare.outputs.branch || '' }}
          EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
        run: |
          echo '## Protected stable promotion' >> "$GITHUB_STEP_SUMMARY"
          echo "**Mode:** $MODE" >> "$GITHUB_STEP_SUMMARY"; echo "**Projects:** $PROJECTS" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source:** $SOURCE_SHA **Branch:** $BRANCH **Expected SHA:** $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'PREPARE requires a manually linked type:chore PR and protected review. FINALIZE reconciles tags → non-prerelease Releases → npm latest.' >> "$GITHUB_STEP_SUMMARY"
