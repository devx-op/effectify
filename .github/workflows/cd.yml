name: 🚀 CD

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Publish existing stable versions without versioning, changelog, or git changes"
        required: true
        type: boolean
        default: false
      projects:
        description: "Comma-separated existing Nx release project names; required for publish-only recovery"
        required: false
        type: string

permissions:
  contents: write # Needed for creating commits and tags
  id-token: write # Needed for npm provenance authentication

jobs:
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip release]') }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for Nx to analyze git history
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Git Configuration
        if: ${{ inputs.publish_only != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔍 Validate Publish-Only Recovery Projects
        id: recovery
        if: ${{ inputs.publish_only == true }}
        env:
          RECOVERY_PROJECTS: ${{ inputs.projects || '' }}
        run: |
          if [ -z "$RECOVERY_PROJECTS" ]; then
            echo "publish-only recovery requires an explicit comma-separated projects input" >&2
            exit 1
          fi
          RELEASE_PROJECTS=$(jq -r '.release.projects[]' nx.json | while read -r path; do
            pnpm nx show project "$path" --json | jq -r '.name'
          done | sort -u)
          SELECTED_PROJECTS=$(printf '%s' "$RECOVERY_PROJECTS" | tr ',' '\n' | sed '/^$/d' | sort -u)
          while IFS= read -r project; do
            if ! printf '%s\n' "$RELEASE_PROJECTS" | grep -Fx -- "$project" >/dev/null; then
              echo "Invalid release project: $project" >&2
              exit 1
            fi
          done <<< "$SELECTED_PROJECTS"
          echo "projects=$(printf '%s' "$SELECTED_PROJECTS" | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: 🔐 Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🔖 Version & Changelog
        if: ${{ inputs.publish_only != true }}
        # Nx Release is the sole owner of changelogs, the release commit, and tags.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm nx release --skip-publish

      - name: 🏗️ Build
        env:
          PUBLISH_ONLY: ${{ inputs.publish_only || false }}
          PROJECTS: ${{ steps.recovery.outputs.projects }}
        run: |
          if [ "$PUBLISH_ONLY" = "true" ]; then
            pnpm nx run-many -t build "--projects=$PROJECTS"
          else
            pnpm nx run-many -t build --all
          fi

      - name: 🚀 Publish
        env:
          PUBLISH_ONLY: ${{ inputs.publish_only || false }}
          PROJECTS: ${{ steps.recovery.outputs.projects }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed for creating GitHub Releases
          NPM_CONFIG_PROVENANCE: true
        # Publish-only recovery uses selected existing manifests; Nx checks registry state.
        run: |
          if [ "$PUBLISH_ONLY" = "true" ]; then
            pnpm nx release publish "--projects=$PROJECTS"
          else
            pnpm nx release publish
          fi
